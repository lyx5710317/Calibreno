# The Marketplace (marketplace/): on pull requests, checks its plugins and
# the community's with the dalibre-plugin of the same commit. On main, and
# daily for the community's new releases, packs each plugin version not
# packed yet and writes marketplace.json, onto the marketplace branch,
# which Calibreno reads (plugin.MarketplaceURL). A pack is never replaced:
# bump a plugin's version to publish a change. catalog.json selects the
# local plugins to check, pack and publish.
name: Marketplace

on:
  pull_request:
    paths: ["marketplace/**", "internal/plugin/**", "cmd/dalibre-plugin/**", ".github/workflows/marketplace.yml"]
  push:
    branches: [main]
    paths: ["marketplace/**", "internal/plugin/**", "cmd/dalibre-plugin/**", ".github/workflows/marketplace.yml"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write # the marketplace branch

concurrency: marketplace-${{ github.ref }}

jobs:
  marketplace:
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: marketplace
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketplace/package-lock.json
      - name: Build dalibre-plugin
        working-directory: .
        run: go build -o /usr/local/bin/dalibre-plugin ./cmd/dalibre-plugin
      - run: npm ci
      - name: Bundle and check the plugins
        run: |
          node index.mjs --folders > "$RUNNER_TEMP/marketplace-folders"
          mapfile -t folders < "$RUNNER_TEMP/marketplace-folders"
          if [ "${#folders[@]}" -eq 0 ]; then
            exit 0
          fi
          node build.mjs "${folders[@]#plugins/}"
          for d in "${folders[@]}"; do
            dalibre-plugin check "$d" | tee /tmp/check.txt
            if grep -q '^warning: uses what' /tmp/check.txt; then
              exit 1
            fi
          done
      # Users of the latest release are offered each plugin its dalibre
      # field allows, so that release's dalibre-plugin must take it: one
      # using what Dalibre added since raises its dalibre to the next one.
      - name: Check the plugins against the latest reachable stable version
        run: |
          tag=$(git tag --merged HEAD --list 'v*' --sort=-version:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !seen { print; seen = 1 }')
          if [ -z "$tag" ]; then
            echo "No stable version tag is reachable. The current checkout was checked above."
            exit 0
          fi
          released=${tag#v}
          git worktree add --detach /tmp/released "$tag"
          (cd /tmp/released && go build -ldflags "-X main.version=$released" -o /tmp/dalibre-plugin-released ./cmd/dalibre-plugin)
          while IFS= read -r d; do
            min=$(jq -r '.dalibre // "" | gsub("[>= ]"; "")' "$d/plugin.json")
            if [ -n "$min" ] && [ "$(printf '%s\n%s\n' "$min" "$released" | sort -V | tail -1)" != "$released" ]; then
              echo "$d: needs Dalibre $min, newer than $released"
              continue
            fi
            /tmp/dalibre-plugin-released check "$d" > /dev/null || {
              echo "::error file=marketplace/$d/plugin.json::Dalibre $released can't load $d at its declared minimum version"
              exit 1
            }
          done < "$RUNNER_TEMP/marketplace-folders"
      - name: Check the catalog and community packages
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DALIBRE_PLUGIN: /usr/local/bin/dalibre-plugin
        run: node index.mjs --check
      - name: Check out the marketplace branch
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/marketplace > /dev/null; then
            git fetch --depth 1 origin +refs/heads/marketplace:refs/remotes/origin/marketplace
            git worktree add --detach /tmp/published origin/marketplace
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            git worktree add --orphan -b marketplace /tmp/published
          fi
      - name: Pack new versions
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/published/packages
          while IFS= read -r d; do
            id=$(jq -r .id "$d/plugin.json")
            version=$(jq -r .version "$d/plugin.json")
            package="/tmp/published/packages/$id-$version.dalibre-plugin"
            if [ ! -e "$package" ]; then
              dalibre-plugin pack "$d" -o /tmp/published/packages
            fi
            if [ ! -s "$package" ]; then
              echo "::error file=marketplace/$d/plugin.json::The package for $id $version is missing or empty."
              exit 1
            fi
          done < "$RUNNER_TEMP/marketplace-folders"
      - name: Write marketplace.json
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DALIBRE_PLUGIN: /usr/local/bin/dalibre-plugin
        run: node index.mjs --out /tmp/published/marketplace.json
      - name: Publish
        if: github.event_name != 'pull_request'
        working-directory: /tmp/published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Marketplace from ${GITHUB_SHA::7}"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/marketplace
