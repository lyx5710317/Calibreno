# Builds Calibreno for every platform when a version tag such as v0.2.0 is
# pushed, then attaches packages to the draft release in this repository.
# A manual run builds Windows installers for an existing release draft.
#
# Optional macOS signing secrets:
#   MACOS_CERTIFICATE            the Developer ID Application certificate with its
#                                private key, a .p12 in base64
#   MACOS_CERTIFICATE_PASSWORD   the password of the .p12
#   APPLE_API_KEY                an App Store Connect API key (the .p8 contents) of
#                                the signing team
#   APPLE_API_KEY_ID             its key ID
#   APPLE_API_ISSUER             its issuer ID
# With these secrets, the macOS job signs and notarizes its disk images.
#
# It also attaches dalibre-plugin binaries to the draft. The upstream
# repository alone publishes the dalibre-plugin packages to npm.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v0.8.1
        required: true
        type: string

permissions:
  contents: write # the draft release, and the uploads to it

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check the requested tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$RELEASE_TAG" != v?* ]] || ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "::error::Provide an existing release tag beginning with v"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', env.RELEASE_TAG) || github.sha }}
      - name: Check that the tag is the version in mygo.json
        run: |
          version="$(jq -r .version cmd/dalibre/mygo.json)"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::tag $RELEASE_TAG does not match version $version in cmd/dalibre/mygo.json"
            exit 1
          fi
      - name: Check that CHANGELOG.md has notes for the version
        run: |
          grep -Eq "^## \[?${RELEASE_TAG#v}\]?( |$)" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no \"## ${RELEASE_TAG#v}\" section"
            exit 1
          }
      - name: Prepare the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
              echo "::error::An existing draft release is required for $RELEASE_TAG"
              exit 1
            fi
          elif ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "Calibreno $RELEASE_TAG" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch'
            && '[{"name":"Windows","os":"windows-latest","platform":"windows/amd64,windows/arm64"}]'
            || '[{"name":"macOS","os":"macos-latest","platform":"darwin/arm64,darwin/amd64"},{"name":"Windows","os":"windows-latest","platform":"windows/amd64,windows/arm64"},{"name":"Linux","os":"ubuntu-latest","platform":"linux/amd64,linux/arm64"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', env.RELEASE_TAG) || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Import the Developer ID certificate and the notary credentials
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "No Developer ID certificate configured. Building ad-hoc signed packages."
            exit 0
          fi
          : "${APPLE_API_KEY:?APPLE_API_KEY is required for notarization}"
          : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID is required for notarization}"
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER is required for notarization}"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: / && !found { print $2; found = 1 }')"
          if [ -z "$identity" ]; then
            echo "::error::The imported certificate does not contain a Developer ID Application identity."
            exit 1
          fi
          # Notarize with an App Store Connect API key, not an Apple ID.
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          rm "$RUNNER_TEMP/AuthKey.p8"
          # Sign with the Developer ID and notarize, for this build only:
          # mygo.json leaves them out so that builds elsewhere need neither.
          jq --arg identity "$identity" --arg keychain "$keychain" \
            '.macos += {signingIdentity: $identity, notarize: {keychainProfile: "notary", keychain: $keychain}}' \
            cmd/dalibre/mygo.json > "$RUNNER_TEMP/mygo.json"
          mv "$RUNNER_TEMP/mygo.json" cmd/dalibre/mygo.json
      - uses: actions/setup-node@v7
        if: runner.os == 'Windows'
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        if: runner.os == 'Windows'
        with:
          python-version: '3.11'
          architecture: x64
      - name: Stage the Windows x64 conversion runtime
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: conversion-runtime
        env:
          CALIBRENO_BUILD_PYTHON: python
        run: |
          npm.cmd ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/stage.mjs
      - name: Build the application packages
        shell: pwsh
        run: go tool mygo build -platform "${{ matrix.platform }}" -o "$env:RUNNER_TEMP/calibreno-release" ./cmd/dalibre
      - name: Attach packages to the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = "$env:RUNNER_TEMP/calibreno-release"
          $targets = "${{ matrix.platform }}".Split(",")
          $packages = @(
            foreach ($target in $targets) {
              $dir = Join-Path $out ($target.Replace("/", "-"))
              $files = @(Get-ChildItem -LiteralPath $dir -File | Where-Object {
                $_.Name -match '(-setup-.*\.exe|\.dmg|\.deb|\.tar\.gz)$'
              })
              if ($files.Count -eq 0) { throw "No release packages for $target" }
              $files.FullName
            }
          )
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $existing = @(gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $packages = @($packages | Where-Object { (Split-Path -Leaf $_) -notin $existing })
            if ($packages.Count -eq 0) {
              Write-Output 'The draft already contains both Windows installers.'
              exit 0
            }
            gh release upload "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" @packages
          } else {
            gh release upload "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --clobber @packages
          }

  plugin-tool:
    needs: draft-release
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm Trusted Publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        if: github.repository == 'djyde/dalibre'
        with:
          node-version: 24 # npm 11.5 or later, for Trusted Publishing
          registry-url: https://registry.npmjs.org
      - name: Build dalibre-plugin
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for p in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/arm64 windows/amd64; do
            os="${p%/*}" arch="${p#*/}" exe=""
            [ "$os" = windows ] && exe=.exe
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$version" -o "dist/dalibre-plugin-$os-$arch$exe" ./cmd/dalibre-plugin
          done
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          for f in dalibre-plugin-*; do
            case "$f" in
              *.exe) zip -q "${f%.exe}.zip" "$f" && gh release upload "$GITHUB_REF_NAME" "${f%.exe}.zip" --clobber --repo "$GITHUB_REPOSITORY" ;;
              *) tar -czf "$f.tar.gz" "$f" && gh release upload "$GITHUB_REF_NAME" "$f.tar.gz" --clobber --repo "$GITHUB_REPOSITORY" ;;
            esac
          done
      - name: Publish to npm
        if: github.repository == 'djyde/dalibre'
        run: |
          version="${GITHUB_REF_NAME#v}"
          node sdk/npm/build.mjs "$version" dist npm-out
          # The platforms' first; a package already published (a re-run) is skipped.
          for d in npm-out/dalibre-plugin-*/ npm-out/dalibre-plugin/; do
            name="$(node -p "require('./$d/package.json').name")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is published already"
              continue
            fi
            (cd "$d" && npm publish --access public --provenance)
          done
